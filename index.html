<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tareas</title>

<style>
:root {
  --bg: #f4f5f7;
  --card: #fafafa;
  --border: #e6e7eb;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #111827;
  --highlight: #f1f5f9; /* 👈 neutro */
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial;
  background: var(--bg);
  color: var(--text);
}

.app {
  max-width: 520px;
  margin: auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 16px;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  background: var(--card);
}

.inputBar {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
}

.inputBar input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
}

.inputBar button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: white;
  cursor: pointer;
}

.list {
  padding: 12px;
  background: #eeeeee;
}

.item {
  background: var(--card);
  border-radius: 12px;
  padding: 6px 8px;
  margin-bottom: 10px;
  display: flex;
  gap: 8px;
  align-items: flex-start;
  cursor: grab;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  transition: background 0.25s ease, opacity 0.2s ease;
}

.item.new {
  background: var(--highlight);
}

.item.done span {
  text-decoration: line-through;
  color: var(--muted);
  transition: all 0.2s ease;
}

.item span {
  flex: 1;
  outline: none;
  font-size: 13px;
  white-space: pre-wrap;
  word-break: break-word;
}

.pin {
  cursor: pointer;
  opacity: 0.4;
}

.pin.active {
  opacity: 1;
}

.delete {
  cursor: pointer;
  opacity: 0;
}

.item:hover .delete {
  opacity: 0.5;
}

.delete:hover {
  opacity: 1;
}

.item.removing {
  opacity: 0;
}

.footer {
  margin-top: auto;
  padding: 12px;
  display: flex;
  gap: 8px;
  border-top: 1px solid var(--border);
  background: var(--card);
}

.footer button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="app">
  <div class="header">Tareas</div>

  <div class="inputBar">
    <input id="input" placeholder="Nueva tarea" autofocus>
    <button onclick="add()">+</button>
  </div>

  <div id="list" class="list"></div>

  <div class="footer">
    <button onclick="clearDone()">Borrar completadas</button>
    <button onclick="clearAll()">Limpiar</button>
  </div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");
let lastAddedIndex = null;

const input = document.getElementById("input");

input.addEventListener("keydown", e => {
  if (e.key === "Enter") add();
});

window.onload = () => input.focus();

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function add() {
  const text = input.value.trim();
  if (!text) return;

  tasks.push({ text, done: false, pinned: false });
  lastAddedIndex = tasks.length - 1;

  input.value = "";
  save();
  render();
}

function toggle(i) {
  tasks[i].done = !tasks[i].done;
  save();
  render();
}

function togglePin(i) {
  tasks[i].pinned = !tasks[i].pinned;
  save();
  render();
}

function removeTask(i, el) {
  el.classList.add("removing");
  setTimeout(() => {
    tasks.splice(i, 1);
    save();
    render();
  }, 180);
}

function edit(i, el) {
  const t = el.innerText.trim();
  if (t) tasks[i].text = t;
  save();
}

function clearAll() {
  tasks = [];
  save();
  render();
}

function clearDone() {
  tasks = tasks.filter(t => !t.done);
  save();
  render();
}

let dragEl = null;

function handleDragStart(e) {
  dragEl = e.currentTarget;
}

function handleDragEnd() {
  const nodes = [...document.querySelectorAll(".item")];

  tasks = nodes.map(node => ({
    text: node.querySelector("span").innerText,
    done: node.querySelector("input").checked,
    pinned: node.querySelector(".pin").classList.contains("active")
  }));

  save();
  render();
}

function handleDragOver(e) {
  e.preventDefault();
  const container = document.getElementById("list");
  const after = getAfter(container, e.clientY);

  if (!after) container.appendChild(dragEl);
  else container.insertBefore(dragEl, after);
}

function getAfter(container, y) {
  const els = [...container.querySelectorAll(".item:not(.dragging)")];

  return els.reduce((closest, el) => {
    const box = el.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;

    if (offset < 0 && offset > closest.offset) {
      return { offset, element: el };
    } else {
      return closest;
    }
  }, { offset: -Infinity }).element;
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  tasks.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "item";
    if (t.done) div.classList.add("done");

    if (i === lastAddedIndex) {
      div.classList.add("new");
      setTimeout(() => div.classList.remove("new"), 300);
    }

    div.draggable = true;
    div.addEventListener("dragstart", handleDragStart);
    div.addEventListener("dragend", handleDragEnd);
    div.addEventListener("dragover", handleDragOver);

    div.innerHTML = `
      <input type="checkbox" ${t.done ? "checked":""} onchange="toggle(${i})">
      <span contenteditable="true" onblur="edit(${i}, this)">${t.text}</span>
      <div class="pin ${t.pinned ? "active":""}" onclick="togglePin(${i})">📌</div>
      <div class="delete" onclick="removeTask(${i}, this.parentElement)">×</div>
    `;

    list.appendChild(div);
  });

  lastAddedIndex = null;
}

render();
</script>

</body>
</html>
