<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notas</title>

<style>
:root {
  --bg: #f4f5f7;
  --card: #fafafa;
  --border: #e6e7eb;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #111827;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 520px;
  margin: auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 16px;
  font-weight: 600;
  font-size: 18px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
}

.inputBar {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
}

.inputBar input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 14px;
  background: white;
}

.inputBar button {
  padding: 12px 16px;
  border-radius: 10px;
  border: none;
  background: var(--accent);
  color: white;
  cursor: pointer;
}

.list {
  padding: 12px;
  background: #d1d5e1;
}

.item {
  background: var(--card);
  border-radius: 12px;

  /* 👇 reducido */
  padding: 8px 10px;

  margin-bottom: 10px;
  display: flex;
  gap: 8px; /* ligeramente más compacto */
  align-items: flex-start;
  cursor: grab;

  border: 1px solid transparent;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  transition: box-shadow 0.15s, transform 0.05s;
}

.item:hover {
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

.item:active {
  transform: scale(0.99);
}

.item.dragging {
  opacity: 0.5;
}

.item.done span {
  text-decoration: line-through;
  color: var(--muted);
}

.item span {
  flex: 1;
  outline: none;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.item span { font-size: 13px; }

.footer {
  margin-top: auto;
  padding: 12px;
  display: flex;
  gap: 8px;
  border-top: 1px solid var(--border);
  background: var(--card);
}

.footer button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="app">
  <div class="header">Notas</div>

  <div class="inputBar">
    <input id="input" placeholder="Nueva tarea">
    <button onclick="add()">Agregar</button>
  </div>

  <div id="list" class="list"></div>

  <div class="footer">
    <button onclick="clearDone()">Borrar completadas</button>
    <button onclick="clearAll()">Limpiar todo</button>
  </div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter") add();
});

function add() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  tasks.push({ text, done: false });
  input.value = "";
  save();
  render();
}

function toggle(i) {
  tasks[i].done = !tasks[i].done;
  save();
  render();
}

function edit(i, el) {
  const t = el.innerText.trim();
  if (t) tasks[i].text = t;
  save();
}

function clearAll() {
  tasks = [];
  save();
  render();
}

function clearDone() {
  tasks = tasks.filter(t => !t.done);
  save();
  render();
}

let dragEl = null;

function handleDragStart(e) {
  dragEl = e.currentTarget;
  dragEl.classList.add("dragging");
}

function handleDragEnd() {
  if (!dragEl) return;
  dragEl.classList.remove("dragging");

  const nodes = [...document.querySelectorAll(".item")];

  tasks = nodes.map(node => ({
    text: node.querySelector("span").innerText,
    done: node.querySelector("input").checked
  }));

  save();
  render();
}

function handleDragOver(e) {
  e.preventDefault();

  const container = document.getElementById("list");
  const after = getDragAfterElement(container, e.clientY);

  if (!after) {
    container.appendChild(dragEl);
  } else {
    container.insertBefore(dragEl, after);
  }
}

function getDragAfterElement(container, y) {
  const elements = [...container.querySelectorAll(".item:not(.dragging)")];

  return elements.reduce((closest, el) => {
    const box = el.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;

    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: el };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  tasks.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "item";
    if (t.done) div.classList.add("done");

    div.draggable = true;
    div.addEventListener("dragstart", handleDragStart);
    div.addEventListener("dragend", handleDragEnd);
    div.addEventListener("dragover", handleDragOver);

    div.innerHTML = `
      <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggle(${i})">
      <span contenteditable="true" onblur="edit(${i}, this)">${t.text}</span>
    `;

    list.appendChild(div);
  });
}

render();
</script>

</body>
</html>
