<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tareas</title>

<style>
:root{
  --bg:#f4f5f7;
  --card:#fafafa;
  --border:#e6e7eb;
  --text:#1f2937;
  --muted:#6b7280;
  --accent:#111827;
  --important:#fb923c;
  --important-bg:#ffe6c8;
}

*{box-sizing:border-box}

body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:var(--bg)}

.app{max-width:520px;margin:auto;height:100vh;display:flex;flex-direction:column}

.header{padding:12px;background:var(--card);border-bottom:1px solid var(--border)}
.tabs{display:flex;justify-content:center;gap:10px}
.tab{padding:6px 12px;border-radius:8px;color:var(--muted);cursor:pointer}
.tab.active{background:var(--border);color:var(--text)}

.inputBar{display:flex;gap:8px;padding:12px;background:var(--card);border-bottom:1px solid var(--border)}
.inputBar input{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border)}
.inputBar button{padding:10px 14px;border-radius:10px;border:none;background:var(--accent);color:#fff}

.list{flex:1;overflow:auto;padding:12px;position:relative}
.list:after{
  content:"";
  position:sticky;
  bottom:0;
  height:30px;
  display:block;
  background:linear-gradient(transparent,var(--bg));
}

.item{
  position:relative;
  background:var(--card);
  border-radius:12px;
  padding:6px 8px 6px 18px;
  margin-bottom:8px;
  display:flex;
  gap:8px;
  align-items:flex-start;
  cursor:grab;
  transition:background .2s ease;
}

.item::before{
  content:"";
  position:absolute;
  left:6px;
  top:8px;
  bottom:8px;
  width:6px;
  background-image:radial-gradient(var(--muted) 1px, transparent 1px);
  background-size:4px 4px;
  opacity:.25;
}

.item.dragging{opacity:.5}

.item span{flex:1;font-size:13px;outline:none}
.item.done span{text-decoration:line-through;color:var(--muted)}
.item.important{background:var(--important-bg)}

.pin{width:10px;height:10px;background:var(--muted);border-radius:50%;cursor:pointer}

.importantDot{
  width:10px;height:10px;border-radius:50%;
  background:var(--important);
  opacity:.4;cursor:pointer;
}
.importantDot.active{opacity:1}

.delete{opacity:0;cursor:pointer}
.item:hover .delete{opacity:.4}

.footer{
  position:sticky;
  bottom:0;
  background:var(--card);
  border-top:1px solid var(--border);
  padding:12px;
  display:flex;
  gap:8px;
}
.footer button{
  flex:1;padding:10px;border-radius:10px;
  border:1px solid var(--border);background:#fff;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('trabajo',this)">Trabajo</div>
    <div class="tab" onclick="switchTab('pendientes',this)">Pendientes</div>
  </div>
</div>

<div class="inputBar">
  <input id="input" placeholder="Nueva tarea">
  <button onclick="add()">+</button>
</div>

<div id="list" class="list"></div>

<div class="footer">
  <button onclick="clearDone()">Borrar completadas</button>
  <button onclick="clearAll()">Limpiar</button>
</div>

</div>

<script>
let data=JSON.parse(localStorage.getItem("tasks_full")||'{"trabajo":[],"pendientes":[]}');
let current="trabajo";
let dragEl=null;

const input=document.getElementById("input");

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") add();
});

function focusInput(){ setTimeout(()=>input.focus(),0); }

function save(){
  localStorage.setItem("tasks_full",JSON.stringify(data));
}

function switchTab(tab,el){
  current=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  render();
  focusInput();
}

function add(){
  const text=input.value.trim();
  if(!text) return;

  data[current].unshift({text,done:false,important:false});
  input.value="";
  save();
  render();
  focusInput();
}

function toggle(i){
  data[current][i].done=!data[current][i].done;
  save();
  render();
}

function toggleImportant(i){
  data[current][i].important=!data[current][i].important;
  save();
  render();
}

function pinTop(i){
  const t=data[current].splice(i,1)[0];
  data[current].unshift(t);
  save();
  render();
}

function removeTask(i){
  data[current].splice(i,1);
  save();
  render();
}

function clearDone(){
  data[current]=data[current].filter(t=>!t.done);
  save();
  render();
}

function clearAll(){
  data[current]=[];
  save();
  render();
}

/* ENTER EN EDICIÓN */
function handleEditKey(e,i,el){
  if(e.key==="Enter"){
    e.preventDefault();

    const text=el.innerText.trim();
    if(text) data[current][i].text=text;

    save();
    el.blur();
    focusInput();
  }
}

/* DRAG */
function onDragStart(e){
  dragEl=e.currentTarget;
  dragEl.classList.add("dragging");
}

function onDragOver(e){
  e.preventDefault();
  const list=document.getElementById("list");
  const after=getAfter(list,e.clientY);

  if(after==null) list.appendChild(dragEl);
  else list.insertBefore(dragEl,after);
}

function onDragEnd(){
  dragEl.classList.remove("dragging");

  const nodes=[...document.querySelectorAll(".item")];

  data[current]=nodes.map(n=>({
    text:n.querySelector("span").innerText,
    done:n.querySelector("input").checked,
    important:n.querySelector(".importantDot").classList.contains("active")
  }));

  save();
  render();
}

function getAfter(container,y){
  const els=[...container.querySelectorAll(".item:not(.dragging)")];

  return els.reduce((closest,el)=>{
    const box=el.getBoundingClientRect();
    const offset=y-box.top-box.height/2;

    if(offset<0 && offset>closest.offset){
      return {offset,element:el};
    }else{
      return closest;
    }
  },{offset:-Infinity}).element;
}

function render(){
  const list=document.getElementById("list");
  list.innerHTML="";

  data[current].forEach((t,i)=>{
    const div=document.createElement("div");
    div.className="item";
    if(t.done) div.classList.add("done");
    if(t.important) div.classList.add("important");

    div.draggable=true;
    div.ondragstart=onDragStart;
    div.ondragover=onDragOver;
    div.ondragend=onDragEnd;

    div.innerHTML=`
      <input type="checkbox" ${t.done?"checked":""} onchange="toggle(${i})">
      <span contenteditable
        onblur="data[current][${i}].text=this.innerText;save()"
        onkeydown="handleEditKey(event, ${i}, this)"
      >${t.text}</span>
      <div class="pin" onclick="pinTop(${i})"></div>
      <div class="importantDot ${t.important?"active":""}" onclick="toggleImportant(${i})"></div>
      <div class="delete" onclick="removeTask(${i})">×</div>
    `;

    list.appendChild(div);
  });
}

render();
focusInput();
</script>

</body>
</html>
